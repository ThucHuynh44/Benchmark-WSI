# Dedicated runtime for the pinned Prov-GigaPath slide encoder.  This mirrors
# upstream environment.yaml at source revision
# 55431e04ff853a08f752a0ba42e6e9c48e60c776 and adds this benchmark's small
# runtime/test dependencies.  Do not merge these pins into merge_thuc.
name: benchmark_gigapath
channels:
  - defaults
  - nvidia
  - pytorch
dependencies:
  - pip
  - python=3.9
  - cuda
  - packaging
  - pytorch==2.0.0
  - torchvision==0.15.0
  - torchaudio==2.0.0
  - pytorch-cuda=11.8
  - pip:
      - omegaconf
      - torchmetrics==0.10.3
      - fvcore
      - iopath
      - xformers==0.0.18
      - huggingface-hub==0.20.2
      - h5py
      - numpy
      - pandas
      - pillow
      - tqdm
      - einops
      - webdataset
      - matplotlib
      - lifelines
      - scikit-survival
      - scikit-learn
      - tensorboard
      - fairscale
      - wandb
      - timm>=1.0.3
      - packaging==23.2
      - ninja==1.11.1.1
      - transformers==4.36.2
      - monai
      - openslide-python
      - scikit-image
      - pyyaml
      - setproctitle
      - pytest
      - git+https://github.com/prov-gigapath/prov-gigapath.git@55431e04ff853a08f752a0ba42e6e9c48e60c776
