defaults:
  config: configs/methods.yaml
  backbone: feather
  result_root: ablations/atlas_v2
  expected_variants: 23

variants:
  atlasv2_base_frozen:
    id: atlasv2_base_frozen
    group: additive_ladder
    model: atlas_v2
    label: Frozen FEATHER + linear CE
    factor: base
    value: frozen
    overrides: &base_frozen
      buffer_size: 0
      atlasv2_lora: false
      atlasv2_replay: false
      atlasv2_prototype: false
      atlasv2_realign: false
      atlasv2_prompt: false
      atlasv2_nce: false
      atlasv2_train_classifier: true

  atlasv2_base_lora:
    id: atlasv2_base_lora
    group: additive_ladder
    model: atlas_v2
    label: Standard LoRA + linear CE
    factor: lora
    value: true
    overrides: &base_lora
      buffer_size: 0
      atlasv2_lora: true
      atlasv2_replay: false
      atlasv2_prototype: false
      atlasv2_realign: false
      atlasv2_prompt: false
      atlasv2_nce: false
      atlasv2_train_classifier: true

  atlasv2_lora_replay:
    id: atlasv2_lora_replay
    group: additive_ladder
    model: atlas_v2
    label: Standard LoRA + full-bag replay
    factor: replay
    value: true
    overrides: &lora_replay
      buffer_size: 30
      atlasv2_lora: true
      atlasv2_replay: true
      atlasv2_prototype: false
      atlasv2_realign: false
      atlasv2_prompt: false
      atlasv2_nce: false
      atlasv2_train_classifier: true

  atlasv2_lora_replay_proto:
    id: atlasv2_lora_replay_proto
    group: additive_ladder
    model: atlas_v2
    label: Standard LoRA + replay + stale prototypes
    factor: prototype
    value: true
    overrides: &lora_replay_proto
      buffer_size: 30
      atlasv2_lora: true
      atlasv2_replay: true
      atlasv2_prototype: true
      atlasv2_realign: false
      atlasv2_prompt: false
      atlasv2_nce: false
      atlasv2_train_classifier: true

  atlasv2_lora_replay_proto_realign:
    id: atlasv2_lora_replay_proto_realign
    group: additive_ladder
    model: atlas_v2
    label: Standard LoRA + replay + realigned prototypes
    factor: realign
    value: true
    overrides: &realigned_core
      buffer_size: 30
      atlasv2_lora: true
      atlasv2_replay: true
      atlasv2_prototype: true
      atlasv2_realign: true
      atlasv2_prompt: false
      atlasv2_nce: false
      atlasv2_train_classifier: true

  atlasv2_frozen_proto:
    id: atlasv2_frozen_proto
    group: frozen_baseline
    model: atlas_v2
    label: Frozen FEATHER continual NCM
    factor: classifier
    value: prototype
    overrides:
      buffer_size: 0
      atlasv2_lora: false
      atlasv2_replay: false
      atlasv2_prototype: true
      atlasv2_realign: false
      atlasv2_prompt: false
      atlasv2_nce: false
      atlasv2_train_classifier: false

  atlasv2_lora_replay_proto_realign_prompt:
    id: atlasv2_lora_replay_proto_realign_prompt
    group: semantic_extension
    model: atlas_v2
    label: Realigned core + semantic prompt branch
    factor: prompt
    value: true
    overrides:
      buffer_size: 30
      atlasv2_lora: true
      atlasv2_replay: true
      atlasv2_prototype: true
      atlasv2_realign: true
      atlasv2_prompt: true
      atlasv2_nce: false
      atlasv2_train_classifier: true

  atlasv2_lora_replay_proto_realign_prompt_nce:
    id: atlasv2_lora_replay_proto_realign_prompt_nce
    group: semantic_extension
    model: atlas_v2
    label: Realigned prompt core + semantic NCE
    factor: nce
    value: true
    overrides:
      buffer_size: 30
      atlasv2_lora: true
      atlasv2_replay: true
      atlasv2_prototype: true
      atlasv2_realign: true
      atlasv2_prompt: true
      atlasv2_nce: true
      atlasv2_train_classifier: true

  atlasv2_base_lora_svd_orthogonal:
    id: atlasv2_base_lora_svd_orthogonal
    group: lora_geometry_extension
    model: atlas_v2
    label: Standard LoRA + SVD-tracked orthogonal updates
    factor: lora_geometry
    value: svd_orthogonal
    overrides:
      buffer_size: 0
      atlasv2_lora: true
      atlasv2_replay: false
      atlasv2_prototype: false
      atlasv2_realign: false
      atlasv2_prompt: false
      atlasv2_nce: false
      atlasv2_train_classifier: true
      atlasv2_svd_orthogonal: true
      atlasv2_svd_energy: 0.99

  atlasv2_replay_proto:
    id: atlasv2_replay_proto
    group: prototype_replay_lora_factorial
    model: atlas_v2
    label: Frozen FEATHER + replay + prototypes
    factor: replay_lora_cell
    value: replay_on_lora_off
    overrides:
      buffer_size: 30
      atlasv2_lora: false
      atlasv2_replay: true
      atlasv2_prototype: true
      atlasv2_realign: false
      atlasv2_prompt: false
      atlasv2_nce: false
      atlasv2_train_classifier: false

  atlasv2_lora_proto:
    id: atlasv2_lora_proto
    group: prototype_replay_lora_factorial
    model: atlas_v2
    label: Standard LoRA + prototypes without replay
    factor: replay_lora_cell
    value: replay_off_lora_on
    overrides:
      buffer_size: 0
      atlasv2_lora: true
      atlasv2_replay: false
      atlasv2_prototype: true
      atlasv2_realign: false
      atlasv2_prompt: false
      atlasv2_nce: false
      atlasv2_train_classifier: true

  atlasv2_base_lora_comel_owlora:
    id: atlasv2_base_lora_comel_owlora
    group: lora_strategy_extension
    model: atlas_v2
    label: CoMEL-style cumulative OWLoRA + linear CE
    factor: lora_strategy
    value: comel_owlora
    overrides:
      buffer_size: 0
      atlasv2_lora: true
      atlasv2_replay: false
      atlasv2_prototype: false
      atlasv2_realign: false
      atlasv2_prompt: false
      atlasv2_nce: false
      atlasv2_train_classifier: true
      atlasv2_comel_owlora: true
      atlasv2_comel_svd_energy: 0.99
      atlasv2_comel_orthogonal_weight: 1.0

  atlasv2_frozen_proto_oas_lda:
    id: atlasv2_frozen_proto_oas_lda
    group: frozen_prototype_extension
    model: atlas_v2
    label: Frozen FEATHER + train-only OAS-LDA prototypes
    factor: prototype_metric
    value: oas_shrinkage_lda
    overrides:
      buffer_size: 0
      atlasv2_lora: false
      atlasv2_replay: false
      atlasv2_prototype: true
      atlasv2_realign: false
      atlasv2_prompt: false
      atlasv2_nce: false
      atlasv2_train_classifier: false
      atlasv2_prototype_lda: true

  atlasv2_frozen_proto_diag:
    id: atlasv2_frozen_proto_diag
    group: distribution_suite
    model: atlas_v2
    label: Frozen FEATHER + diagonal distribution prototypes
    factor: distribution_metric
    value: diagonal
    overrides: &distribution_base
      buffer_size: 0
      atlasv2_lora: false
      atlasv2_replay: false
      atlasv2_prototype: true
      atlasv2_realign: false
      atlasv2_prompt: false
      atlasv2_nce: false
      atlasv2_train_classifier: false
      atlasv2_distribution_mode: diag
      atlasv2_distribution_alpha: 0.1
      atlasv2_distribution_rho: 0.5
      atlasv2_distribution_rank: 8
      atlasv2_distribution_clusters: 3
      atlasv2_distribution_tau_multi: 0.1
      atlasv2_distribution_beta: 0.25
      atlasv2_distribution_tau_task: 0.1
      atlasv2_pt_steps: 200
      atlasv2_pt_lr: 0.05
      atlasv2_pt_samples_per_class: 32
      atlasv2_pt_margin: 0.2
      atlasv2_ranpac_dim: 10000
      atlasv2_ranpac_ridge: 1.0

  atlasv2_frozen_proto_diag_shrink:
    id: atlasv2_frozen_proto_diag_shrink
    group: distribution_suite
    model: atlas_v2
    label: Frozen FEATHER + shrinkage-normalized diagonal distributions
    factor: covariance_shrinkage
    value: diagonal_shrinkage
    overrides:
      <<: *distribution_base
      atlasv2_distribution_mode: diag_shrink

  atlasv2_frozen_proto_lowrank:
    id: atlasv2_frozen_proto_lowrank
    group: distribution_suite
    model: atlas_v2
    label: Frozen FEATHER + trace-normalized low-rank distributions
    factor: covariance_structure
    value: lowrank
    overrides:
      <<: *distribution_base
      atlasv2_distribution_mode: lowrank

  atlasv2_frozen_proto_task_centroid:
    id: atlasv2_frozen_proto_task_centroid
    group: distribution_suite
    model: atlas_v2
    label: Diagonal shrinkage + equal-class task centroid calibration
    factor: task_calibration
    value: centroid
    overrides:
      <<: *distribution_base
      atlasv2_distribution_mode: task_centroid

  atlasv2_frozen_proto_task_lme:
    id: atlasv2_frozen_proto_task_lme
    group: distribution_suite
    model: atlas_v2
    label: Diagonal shrinkage + soft task LME calibration
    factor: task_calibration
    value: lme
    overrides:
      <<: *distribution_base
      atlasv2_distribution_mode: task_lme

  atlasv2_frozen_proto_multi:
    id: atlasv2_frozen_proto_multi
    group: distribution_suite
    model: atlas_v2
    label: Frozen FEATHER + deterministic multi-prototypes
    factor: prototype_cardinality
    value: multi
    overrides:
      <<: *distribution_base
      atlasv2_distribution_mode: multi

  atlasv2_frozen_proto_pt_only:
    id: atlasv2_frozen_proto_pt_only
    group: distribution_suite
    model: atlas_v2
    label: Diagonal shrinkage + train-only prototype tuning
    factor: prototype_tuning
    value: point_only
    overrides:
      <<: *distribution_base
      atlasv2_distribution_mode: pt_only

  atlasv2_frozen_atlas_tf:
    id: atlasv2_frozen_atlas_tf
    group: distribution_suite
    model: atlas_v2
    label: ATLAS-TF low-rank + multi-prototype + task LME
    factor: full_method
    value: training_free
    overrides:
      <<: *distribution_base
      atlasv2_distribution_mode: atlas_tf

  atlasv2_frozen_atlas_pt:
    id: atlasv2_frozen_atlas_pt
    group: distribution_suite
    model: atlas_v2
    label: ATLAS-TF + train-only prototype tuning
    factor: full_method
    value: prototype_tuned
    overrides:
      <<: *distribution_base
      atlasv2_distribution_mode: atlas_pt

  atlasv2_frozen_ranpac:
    id: atlasv2_frozen_ranpac
    group: distribution_suite
    model: atlas_v2
    label: RanPAC Phase-2 architecture-faithful analytic baseline
    factor: analytic_baseline
    value: ranpac_phase2
    overrides:
      <<: *distribution_base
      atlasv2_distribution_mode: ranpac
