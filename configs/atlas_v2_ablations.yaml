defaults:
  config: configs/methods.yaml
  backbone: feather
  result_root: ablations/atlas_v2
  expected_variants: 12

variants:
  atlasv2_base_frozen:
    id: atlasv2_base_frozen
    group: additive_ladder
    model: atlas_v2
    label: Frozen FEATHER + linear CE
    factor: base
    value: frozen
    overrides: &base_frozen
      buffer_size: 0
      atlasv2_lora: false
      atlasv2_replay: false
      atlasv2_prototype: false
      atlasv2_realign: false
      atlasv2_prompt: false
      atlasv2_nce: false
      atlasv2_train_classifier: true

  atlasv2_base_lora:
    id: atlasv2_base_lora
    group: additive_ladder
    model: atlas_v2
    label: Standard LoRA + linear CE
    factor: lora
    value: true
    overrides: &base_lora
      buffer_size: 0
      atlasv2_lora: true
      atlasv2_replay: false
      atlasv2_prototype: false
      atlasv2_realign: false
      atlasv2_prompt: false
      atlasv2_nce: false
      atlasv2_train_classifier: true

  atlasv2_lora_replay:
    id: atlasv2_lora_replay
    group: additive_ladder
    model: atlas_v2
    label: Standard LoRA + full-bag replay
    factor: replay
    value: true
    overrides: &lora_replay
      buffer_size: 30
      atlasv2_lora: true
      atlasv2_replay: true
      atlasv2_prototype: false
      atlasv2_realign: false
      atlasv2_prompt: false
      atlasv2_nce: false
      atlasv2_train_classifier: true

  atlasv2_lora_replay_proto:
    id: atlasv2_lora_replay_proto
    group: additive_ladder
    model: atlas_v2
    label: Standard LoRA + replay + stale prototypes
    factor: prototype
    value: true
    overrides: &lora_replay_proto
      buffer_size: 30
      atlasv2_lora: true
      atlasv2_replay: true
      atlasv2_prototype: true
      atlasv2_realign: false
      atlasv2_prompt: false
      atlasv2_nce: false
      atlasv2_train_classifier: true

  atlasv2_lora_replay_proto_realign:
    id: atlasv2_lora_replay_proto_realign
    group: additive_ladder
    model: atlas_v2
    label: Standard LoRA + replay + realigned prototypes
    factor: realign
    value: true
    overrides: &realigned_core
      buffer_size: 30
      atlasv2_lora: true
      atlasv2_replay: true
      atlasv2_prototype: true
      atlasv2_realign: true
      atlasv2_prompt: false
      atlasv2_nce: false
      atlasv2_train_classifier: true

  atlasv2_frozen_proto:
    id: atlasv2_frozen_proto
    group: frozen_baseline
    model: atlas_v2
    label: Frozen FEATHER continual NCM
    factor: classifier
    value: prototype
    overrides:
      buffer_size: 0
      atlasv2_lora: false
      atlasv2_replay: false
      atlasv2_prototype: true
      atlasv2_realign: false
      atlasv2_prompt: false
      atlasv2_nce: false
      atlasv2_train_classifier: false

  atlasv2_lora_replay_proto_realign_prompt:
    id: atlasv2_lora_replay_proto_realign_prompt
    group: semantic_extension
    model: atlas_v2
    label: Realigned core + semantic prompt branch
    factor: prompt
    value: true
    overrides:
      buffer_size: 30
      atlasv2_lora: true
      atlasv2_replay: true
      atlasv2_prototype: true
      atlasv2_realign: true
      atlasv2_prompt: true
      atlasv2_nce: false
      atlasv2_train_classifier: true

  atlasv2_lora_replay_proto_realign_prompt_nce:
    id: atlasv2_lora_replay_proto_realign_prompt_nce
    group: semantic_extension
    model: atlas_v2
    label: Realigned prompt core + semantic NCE
    factor: nce
    value: true
    overrides:
      buffer_size: 30
      atlasv2_lora: true
      atlasv2_replay: true
      atlasv2_prototype: true
      atlasv2_realign: true
      atlasv2_prompt: true
      atlasv2_nce: true
      atlasv2_train_classifier: true

  atlasv2_base_lora_svd_orthogonal:
    id: atlasv2_base_lora_svd_orthogonal
    group: lora_geometry_extension
    model: atlas_v2
    label: Standard LoRA + SVD-tracked orthogonal updates
    factor: lora_geometry
    value: svd_orthogonal
    overrides:
      buffer_size: 0
      atlasv2_lora: true
      atlasv2_replay: false
      atlasv2_prototype: false
      atlasv2_realign: false
      atlasv2_prompt: false
      atlasv2_nce: false
      atlasv2_train_classifier: true
      atlasv2_svd_orthogonal: true
      atlasv2_svd_energy: 0.99

  atlasv2_replay_proto:
    id: atlasv2_replay_proto
    group: prototype_replay_lora_factorial
    model: atlas_v2
    label: Frozen FEATHER + replay + prototypes
    factor: replay_lora_cell
    value: replay_on_lora_off
    overrides:
      buffer_size: 30
      atlasv2_lora: false
      atlasv2_replay: true
      atlasv2_prototype: true
      atlasv2_realign: false
      atlasv2_prompt: false
      atlasv2_nce: false
      atlasv2_train_classifier: false

  atlasv2_lora_proto:
    id: atlasv2_lora_proto
    group: prototype_replay_lora_factorial
    model: atlas_v2
    label: Standard LoRA + prototypes without replay
    factor: replay_lora_cell
    value: replay_off_lora_on
    overrides:
      buffer_size: 0
      atlasv2_lora: true
      atlasv2_replay: false
      atlasv2_prototype: true
      atlasv2_realign: false
      atlasv2_prompt: false
      atlasv2_nce: false
      atlasv2_train_classifier: true

  atlasv2_base_lora_comel_owlora:
    id: atlasv2_base_lora_comel_owlora
    group: lora_strategy_extension
    model: atlas_v2
    label: CoMEL-style cumulative OWLoRA + linear CE
    factor: lora_strategy
    value: comel_owlora
    overrides:
      buffer_size: 0
      atlasv2_lora: true
      atlasv2_replay: false
      atlasv2_prototype: false
      atlasv2_realign: false
      atlasv2_prompt: false
      atlasv2_nce: false
      atlasv2_train_classifier: true
      atlasv2_comel_owlora: true
      atlasv2_comel_svd_energy: 0.99
      atlasv2_comel_orthogonal_weight: 1.0
