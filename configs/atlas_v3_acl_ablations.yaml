defaults:
  config: configs/methods.yaml
  backbone: feather
  result_root: ablations/atlas_v3_acl
  expected_variants: 4

variants:
  atlasv3_acl:
    id: atlasv3_acl
    group: paper_ablation
    model: atlas_v3_acl
    label: ACL current-task adaptation with static NCM prototypes
    factor: classifier
    value: ncm
    overrides: {atlasv3_acl_mode: acl}

  atlasv3_acl_normalized_oas_static:
    id: atlasv3_acl_normalized_oas_static
    group: paper_ablation
    model: atlas_v3_acl
    label: ACL adaptation with static normalized OAS-LDA statistics
    factor: historical_statistics
    value: static
    overrides: {atlasv3_acl_mode: normalized_oas_static}

  atlasv3_acl_transport_normalized_oas:
    id: atlasv3_acl_transport_normalized_oas
    group: paper_ablation
    model: atlas_v3_acl
    label: ACL adaptation with ungated normalized OAS-LDA transport
    factor: historical_statistics
    value: ungated_transport
    overrides: {atlasv3_acl_mode: transport_normalized_oas}

  atlasv3_acl_gated_transport_normalized_oas_no_histneg:
    id: atlasv3_acl_gated_transport_normalized_oas_no_histneg
    group: paper_ablation
    model: atlas_v3_acl
    label: ACL adaptation with gated normalized OAS-LDA transport
    factor: historical_statistics
    value: gated_transport
    overrides: {atlasv3_acl_mode: gated_transport_normalized_oas_no_histneg}
