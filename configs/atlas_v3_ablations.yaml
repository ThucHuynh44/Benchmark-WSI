  atlasv3_frozen_proto_oas_lda:
    id: atlasv3_frozen_proto_oas_lda
    group: frozen_prototype_suite
    model: atlas_v3
    label: Frozen FEATHER + train-only OAS-LDA prototypes
    factor: prototype_metric
    value: oas_shrinkage_lda
    overrides:
      atlasv3_distribution_mode: oas_lda

  atlasv3_frozen_proto:
