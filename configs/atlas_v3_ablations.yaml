defaults:
  config: configs/methods.yaml
  backbone: feather
  result_root: ablations/atlas_v3
  expected_variants: 11

variants:
  atlasv3_frozen_proto_diag:
    id: atlasv3_frozen_proto_diag
    group: frozen_prototype_suite
    model: atlas_v3
    label: Frozen FEATHER + diagonal distribution prototypes
    factor: distribution_metric
    value: diagonal
    overrides:
      atlasv3_distribution_mode: diag

  atlasv3_frozen_proto_diag_shrink:
    id: atlasv3_frozen_proto_diag_shrink
    group: frozen_prototype_suite
    model: atlas_v3
    label: Frozen FEATHER + shrinkage-normalized diagonal distributions
    factor: covariance_shrinkage
    value: diagonal_shrinkage
    overrides:
      atlasv3_distribution_mode: diag_shrink

  atlasv3_frozen_proto_lowrank:
    id: atlasv3_frozen_proto_lowrank
    group: frozen_prototype_suite
    model: atlas_v3
    label: Frozen FEATHER + trace-normalized low-rank distributions
    factor: covariance_structure
    value: lowrank
    overrides:
      atlasv3_distribution_mode: lowrank

  atlasv3_frozen_proto_task_centroid:
    id: atlasv3_frozen_proto_task_centroid
    group: frozen_prototype_suite
    model: atlas_v3
    label: Diagonal shrinkage + equal-class task centroid calibration
    factor: task_calibration
    value: centroid
    overrides:
      atlasv3_distribution_mode: task_centroid

  atlasv3_frozen_proto_task_lme:
    id: atlasv3_frozen_proto_task_lme
    group: frozen_prototype_suite
    model: atlas_v3
    label: Diagonal shrinkage + soft task LME calibration
    factor: task_calibration
    value: lme
    overrides:
      atlasv3_distribution_mode: task_lme

  atlasv3_frozen_proto_multi:
    id: atlasv3_frozen_proto_multi
    group: frozen_prototype_suite
    model: atlas_v3
    label: Frozen FEATHER + deterministic multi-prototypes
    factor: prototype_cardinality
    value: multi
    overrides:
      atlasv3_distribution_mode: multi

  atlasv3_frozen_proto_pt_only:
    id: atlasv3_frozen_proto_pt_only
    group: frozen_prototype_suite
    model: atlas_v3
